# Tagging service next to a local musicbrainz-docker mirror. See README "Deploy".
#
#   cd deploy && docker compose up -d --build
#
services:
  tagging-ms:
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: tagging-ms:latest
    env_file: .env
    environment:
      TAGGING_MS_ENV: production
      TAGGING_MS_HOST: 0.0.0.0
      TAGGING_MS_PORT: "8000"
    ports:
      # Explicit 127.0.0.1: Compose sends 0.0.0.0 as the host IP, overriding any
      # daemon-level default, and Docker's iptables rules bypass the host firewall.
      - "127.0.0.1:8000:8000"
    volumes:
      - /run/mirror:/run/mirror:ro
    networks: [tagging, mirror]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/version', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  tagging: {}
  mirror:
    external: true
    name: musicbrainz-docker_default
